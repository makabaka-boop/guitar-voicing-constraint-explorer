<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>指板和弦形状搜索</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1f232b;
    --panel-2: #262b35;
    --border: #363d4a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #f0b45a;
    --accent-2: #7cc7ff;
    --danger: #ff7c7c;
    --ok: #8fd694;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.6;
  }
  header { padding: 20px 24px 8px; }
  header h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 16px;
    padding: 16px 24px 32px;
    align-items: start;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  section h2 { margin: 0 0 12px; font-size: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  label.field { display: block; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  input[type="number"], select {
    width: 100%;
    margin-top: 4px;
    padding: 6px 8px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .string-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pc-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
  button {
    padding: 6px 12px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #20180a; font-weight: 600; }
  button.toggle.on { background: var(--accent-2); border-color: var(--accent-2); color: #0a1a26; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: end; }
  .row > * { flex: 1; }
  .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; white-space: pre-line; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .stats { font-size: 13px; color: var(--muted); margin-bottom: 10px; white-space: pre-line; }
  .stats b { color: var(--text); }
  ol.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ol.results li button {
    width: 100%;
    text-align: left;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  ol.results li button.selected { border-color: var(--accent); background: #2e2a20; }
  .meta { color: var(--muted); font-size: 12px; }
  #fretboard { width: 100%; height: auto; display: block; }
  .diag-selects { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 10px; }
  ul.reasons { margin: 10px 0 0; padding-left: 20px; font-size: 13px; }
  ul.reasons li.bad { color: var(--danger); }
  .ok-text { color: var(--ok); font-size: 13px; margin: 10px 0 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>指板和弦形状搜索</h1>
  <p>枚举音高正确且手指可及的按法：每弦可闷音或按 0–最大品位，弹响弦 ≥ 3，音级仅来自目标且全覆盖，按弦手指 ≤ 4（不计横按），非零品位跨度 ≤ 4。按 跨度 → 品位总和 → 低→高弦向量（闷音居后）排序，取前 20。</p>
</header>
<main>
  <section id="controls">
    <h2>搜索参数</h2>
    <div class="presets" id="tuning-presets"></div>
    <div class="row">
      <label class="field">弦数（4–6）
        <select id="string-count">
          <option value="4">4 根弦</option>
          <option value="5">5 根弦</option>
          <option value="6" selected>6 根弦</option>
        </select>
      </label>
      <label class="field">最大品位（3–9）
        <input type="number" id="max-fret" min="3" max="9" value="5">
      </label>
    </div>
    <label class="field">开放弦 MIDI 音高（从低音弦到高音弦）</label>
    <div class="string-inputs" id="string-inputs"></div>
    <label class="field" style="margin-top:12px">目标音级（选择 2–5 个）</label>
    <div class="pc-grid" id="pc-grid"></div>
    <div class="row">
      <label class="field">和弦快捷填充
        <select id="chord-root"></select>
      </label>
      <label class="field">&nbsp;
        <select id="chord-quality"></select>
      </label>
    </div>
    <p class="error" id="error"></p>
    <button class="primary" id="search" style="width:100%;margin-top:8px">搜索</button>
    <p class="hint" id="status"></p>
  </section>

  <div class="col">
    <section id="results">
      <h2>搜索结果（前 20）</h2>
      <div class="stats" id="stats">尚未搜索。</div>
      <ol class="results" id="result-list"></ol>
    </section>

    <section id="preview">
      <h2>指板预览</h2>
      <div class="stats" id="preview-info">点击任一结果在此预览。弦序自低音弦（①）到高音弦，× 为闷音，○ 为开放弦。</div>
      <svg id="fretboard" role="img" aria-label="指板预览"></svg>
    </section>

    <section id="diagnose">
      <h2>排除原因诊断</h2>
      <p class="hint">为每根弦选择闷音或品位，检查该按法为何被排除；若合规则给出它在全部合法形状中的名次。</p>
      <div class="diag-selects" id="diag-selects"></div>
      <button id="diagnose-btn">检查该按法</button>
      <div id="diag-output"></div>
    </section>
  </div>
</main>
<script src="./app.js" defer></script>
</body>
</html>
