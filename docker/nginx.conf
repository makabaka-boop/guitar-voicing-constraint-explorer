server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页静态站点：任何路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容指纹的静态资源可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
